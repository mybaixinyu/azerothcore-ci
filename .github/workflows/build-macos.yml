name: build-macos

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'mod-playerbots/azerothcore-wotlk ref'
        default: 'Playerbot'
      module_ref:
        description: 'mod-playerbots/mod-playerbots ref'
        default: 'master'
      bridge_ref:
        description: 'Aldori15/mod-questie-bridge ref'
        default: 'main'
      tsan:
        description: 'Build with ThreadSanitizer (separate artifact, never installed into server-pb)'
        type: boolean
        default: false
      lto:
        description: 'Build with ThinLTO'
        type: boolean
        default: true
      pgo_generate:
        description: 'Instrument for a PGO training run instead of using pgo/worldserver.profdata'
        type: boolean
        default: false

jobs:
  build:
    runs-on: xcode-27
    env:
      # Only a staging layout: patch 0002 makes the binaries find their configs
      # and OpenSSL provider relative to where they are run from, so nothing
      # built here depends on this path.
      PREFIX: /opt/azerothcore-pb
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      VARIANT: ${{ inputs.tsan && '-tsan' || '' }}
      LTO_FLAG: ${{ inputs.lto && '-flto=thin' || '' }}
      CCACHE_KEY: xcode-27${{ inputs.tsan && '-tsan' || '' }}${{ inputs.lto && '-lto' || '' }}${{ inputs.pgo_generate && '-pgen' || '' }}

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v7
        with:
          path: ci

      - name: Checkout core
        uses: actions/checkout@v7
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: ${{ inputs.core_ref }}
          path: src

      - name: Checkout playerbots module
        uses: actions/checkout@v7
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ inputs.module_ref }}
          path: src/modules/mod-playerbots

      # Server side of the Questie-335 addon; pure script module, no SQL.
      - name: Checkout questie bridge module
        uses: actions/checkout@v7
        with:
          repository: Aldori15/mod-questie-bridge
          ref: ${{ inputs.bridge_ref }}
          path: src/modules/mod-questie-bridge

      # Left uncommitted on purpose: the worldserver revision banner then carries
      # the '+' suffix that marks a patched tree, exactly like a local build.
      - name: Apply patches
        run: |
          for p in "$GITHUB_WORKSPACE"/ci/patches/*.patch; do
            echo "== $p"
            git -C src apply --verbose "$p"
          done
          for p in "$GITHUB_WORKSPACE"/ci/patches/module/*.patch; do
            echo "== $p"
            git -C src/modules/mod-playerbots apply --verbose "$p"
          done

      - name: Install dependencies
        run: |
          brew update --quiet
          brew install --quiet boost openssl@3 readline mysql@8.4 ccache ninja

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache:${{ env.CCACHE_KEY }}:${{ inputs.core_ref }}:${{ github.run_id }}
          restore-keys: |
            ccache:${{ env.CCACHE_KEY }}:${{ inputs.core_ref }}:
            ccache:${{ env.CCACHE_KEY }}:

      # Flags mirror the local build; keep the two in step when either changes.
      # TSan reports need line numbers, so that variant also carries debug info.
      - name: Configure
        run: |
          pgo_flag=
          if [ "${{ inputs.pgo_generate }}" = true ]; then
            pgo_flag=-fprofile-generate
          elif [ -f "$GITHUB_WORKSPACE/ci/pgo/worldserver.profdata" ]; then
            pgo_flag="-fprofile-use=$GITHUB_WORKSPACE/ci/pgo/worldserver.profdata"
          fi
          cmake -S src -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=${{ inputs.tsan && 'RelWithDebInfo' || 'Release' }} \
            -DTSAN=${{ inputs.tsan && 'ON' || 'OFF' }} \
            -DCMAKE_C_FLAGS="$LTO_FLAG $pgo_flag" \
            -DCMAKE_CXX_FLAGS="$LTO_FLAG $pgo_flag" \
            -DCMAKE_EXE_LINKER_FLAGS="$LTO_FLAG $pgo_flag" \
            -DAPPS_BUILD=all \
            -DTOOLS_BUILD=none \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DBUILD_TESTING=OFF \
            -DWITH_WARNINGS=OFF \
            -DUSE_COREPCH=ON \
            -DUSE_SCRIPTPCH=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
            -DMYSQL_ADD_INCLUDE_PATH=/opt/homebrew/opt/mysql@8.4/include/mysql \
            -DREADLINE_INCLUDE_DIR=/opt/homebrew/opt/readline/include \
            -DREADLINE_LIBRARY=/opt/homebrew/opt/readline/lib/libreadline.dylib

      # The core only adds -fsanitize=thread to targets that link its option interface;
      # the module is where the races were, so check its flags rather than assume them.
      - name: Check the module is instrumented
        if: inputs.tsan
        run: |
          awk '/^build [^:]*mod-playerbots[^:]*TravelMgr\.cpp\.o:/{f=1} f&&/^  FLAGS/{print; exit}' build/build.ninja \
            | grep -q -- '-fsanitize=thread'

      # The ccache statistics live in the cache directory and accumulate across runs;
      # zero them so the report below describes this build only.
      - name: Reset ccache statistics
        run: ccache -z

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # The flags reach every target only through CMake's defaults, so read an object
      # file: a ThinLTO one is bitcode (raw or with the Darwin wrapper), not Mach-O.
      - name: Check the objects are bitcode
        if: inputs.lto
        run: |
          obj=$(find build -name 'Unit.cpp.o' | head -1)
          case "$(xxd -l4 -p "$obj")" in
            4243c0de|dec0170b) ;;
            *) echo "$obj is not bitcode"; exit 1 ;;
          esac

      # Read the hit rate here rather than inferring it from the wall clock.
      - name: ccache stats
        run: ccache -sv

      - name: Install
        run: |
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build
          ln -s "$GITHUB_WORKSPACE/stage$PREFIX" "$GITHUB_WORKSPACE/out"
          test -f "$GITHUB_WORKSPACE/out/bin/worldserver"

      - name: Bundle dylibs
        run: ci/scripts/bundle-dylibs.sh "$GITHUB_WORKSPACE/out/bin"

      # The debug info stays in the build tree's object files; the server machine has none.
      - name: Collect debug symbols
        if: inputs.tsan
        run: |
          for b in worldserver authserver; do
            dsymutil "$GITHUB_WORKSPACE/out/bin/$b" -o "$GITHUB_WORKSPACE/out/bin/$b.dSYM"
          done
          du -sh "$GITHUB_WORKSPACE"/out/bin/*.dSYM

      # The DB updater reads its SQL from SourceDirectory, which on the server
      # machine points at the copy installed from here. base/ (fresh-install
      # dumps) and old/ (pre-3.3.5 history) are not in updates_include, so the
      # updater never looks at them.
      - name: Stage the SQL the updater needs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/sql-source/data/sql" \
                   "$GITHUB_WORKSPACE/out/sql-source/modules/mod-playerbots/data"
          for d in updates archive custom create playerbots; do
            [ -d "src/data/sql/$d" ] || continue
            cp -R "src/data/sql/$d" "$GITHUB_WORKSPACE/out/sql-source/data/sql/"
          done
          cp -R src/modules/mod-playerbots/data/sql \
                "$GITHUB_WORKSPACE/out/sql-source/modules/mod-playerbots/data/"
          # git does not carry empty directories, and updates_include lists these
          # by name: without them every startup logs a "does not exist, skipped".
          for db in auth characters world; do
            mkdir -p "$GITHUB_WORKSPACE/out/sql-source/data/sql/custom/db_$db"
          done
          mkdir -p "$GITHUB_WORKSPACE/out/sql-source/modules/mod-playerbots/data/sql/playerbots/archive"
          du -sh "$GITHUB_WORKSPACE/out/sql-source"

      - name: Check the OpenSSL legacy provider is bundled
        run: test -f "$GITHUB_WORKSPACE/out/bin/lib/ossl-modules/legacy.dylib"

      - name: Write manifest
        run: |
          {
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${{ runner.name }} macOS $(sw_vers -productVersion) $(uname -m) xcode=$(xcodebuild -version | head -1)"
            echo "compiler=$(c++ --version | head -1)"
            echo "core_ref=${{ inputs.core_ref }} $(git -C src rev-parse HEAD)"
            echo "module_ref=${{ inputs.module_ref }} $(git -C src/modules/mod-playerbots rev-parse HEAD)"
            echo "bridge_ref=${{ inputs.bridge_ref }} $(git -C src/modules/mod-questie-bridge rev-parse HEAD)"
            echo "ci_commit=$(git -C ci rev-parse HEAD)"
            echo "tsan=${{ inputs.tsan }}"
            echo "lto=${{ inputs.lto }}"
            echo "pgo_generate=${{ inputs.pgo_generate }}"
            [ "${{ inputs.pgo_generate }}" != true ] && [ -f ci/pgo/worldserver.profdata ] && echo "pgo_profile=$(shasum -a 256 ci/pgo/worldserver.profdata | cut -d' ' -f1)"
            for p in ci/patches/*.patch ci/patches/module/*.patch; do
              echo "patch=$(basename "$p") $(shasum -a 256 "$p" | cut -d' ' -f1)"
            done
          } > out/bin/BUILD-MANIFEST.txt
          cat out/bin/BUILD-MANIFEST.txt

      - name: Check the payload is self-contained
        run: |
          fail=0
          while read -r f; do
            case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
            bad=$(otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | grep -vE '^(/usr/lib/|/System/|@executable_path/|@rpath/|@loader_path/)' || true)
            if [ -n "$bad" ]; then echo "$f still points outside the bundle:"; echo "$bad"; fail=1; fi
          done < <(find out/bin -type f)
          exit $fail

      - name: Report sizes
        run: du -sh out/bin out/bin/lib && ls -lh out/bin

      - uses: actions/upload-artifact@v5
        with:
          name: server-pb-macos-arm64${{ env.VARIANT }}
          path: stage/opt/azerothcore-pb/
          retention-days: 30
          if-no-files-found: error
